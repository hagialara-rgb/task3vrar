<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3 - WebAR Image Tracking</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0a0a0a; font-family: Arial, sans-serif; overflow: hidden; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(135deg, #0d0d0d, #1a0033);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 24px;
        color: white; text-align: center; padding: 32px;
      }
      #splash h1 { font-size: 26px; color: #9B30FF; }
      #splash p  { font-size: 14px; color: #aaa; max-width: 300px; line-height: 1.6; }
      #startBtn {
        margin-top: 16px;
        padding: 16px 40px;
        background: linear-gradient(135deg, #9B30FF, #FF4DAF);
        color: white; font-size: 18px; font-weight: bold;
        border: none; border-radius: 50px; cursor: pointer;
        box-shadow: 0 0 30px rgba(155,48,255,0.5);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,100% { box-shadow: 0 0 30px rgba(155,48,255,0.5); }
        50%      { box-shadow: 0 0 50px rgba(255,77,175,0.8); }
      }
      #splash .target-hint {
        border: 2px solid #9B30FF; border-radius: 12px;
        padding: 12px; max-width: 200px;
      }
      #splash .target-hint img { width: 100%; border-radius: 8px; }
      #splash .target-hint small { display: block; color: #9B30FF; margin-top: 6px; font-size: 11px; }
      #ui-overlay {
        position: fixed; top: 14px; left: 50%;
        transform: translateX(-50%); z-index: 999;
        background: rgba(0,0,0,0.6); color: #fff;
        font-size: 13px; padding: 7px 16px;
        border-radius: 20px; pointer-events: none;
        backdrop-filter: blur(6px); display: none;
      }
      #status {
        position: fixed; bottom: 20px; left: 50%;
        transform: translateX(-50%); z-index: 999;
        color: #ffff00; font-family: monospace; font-size: 13px;
        background: rgba(0,0,0,0.6); padding: 6px 14px;
        border-radius: 10px; display: none;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <h1>WebAR – Task 3</h1>
      <p>Apasa START si apoi pointeaza camera spre imaginea de mai jos:</p>
      <div class="target-hint">
        <img src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" alt="target" />
        <small>IMAGINEA TARGET</small>
      </div>
      <button id="startBtn" onclick="startAR()">START AR</button>
      <p style="font-size:11px;color:#666;">Permite accesul la camera cand apare popup-ul!</p>
    </div>
    <div id="ui-overlay">Pointeaza camera spre Target Card</div>
    <div id="status">Cautare target...</div>
    <a-scene id="arScene"
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiScanning: yes;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-box position="0 0.15 0"
          width="0.3" height="0.3" depth="0.3"
          color="#9B30FF"
          material="metalness:0.5; roughness:0.3; emissive:#1a0033"
          animation__rotate="property:rotation; to:0 360 0; loop:true; dur:3000; easing:linear"
          animation__bob="property:position; from:0 0.12 0; to:0 0.22 0; loop:true; dir:alternate; dur:1000; easing:easeInOutSine">
        </a-box>
        <a-sphere position="0 0.38 0" radius="0.07" color="#00E676"
          material="metalness:0.8; roughness:0.1; emissive:#002200"
          animation__pulse="property:scale; from:1 1 1; to:1.3 1.3 1.3; loop:true; dir:alternate; dur:800; easing:easeInOutSine">
        </a-sphere>
        <a-torus position="0 0.01 0" rotation="90 0 0"
          radius="0.22" radius-tubular="0.015" color="#FF4DAF"
          material="metalness:0.9; roughness:0.1"
          animation__spin="property:rotation; from:90 0 0; to:90 360 0; loop:true; dur:4000; easing:linear">
        </a-torus>
        <a-text value="WebAR - Task 3" align="center" color="#ffffff"
          position="0 -0.35 0.1" rotation="-30 0 0" scale="0.35 0.35 0.35">
        </a-text>
        <a-light type="point" color="#9B30FF" intensity="1.5" position="0 0.5 0" distance="2"></a-light>
      </a-entity>
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.5" position="1 2 1"></a-light>
    </a-scene>
    <script>
      function startAR() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(function(stream) {
            stream.getTracks().forEach(function(t) { t.stop(); });
            document.getElementById('splash').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('status').style.display = 'block';
            document.getElementById('arScene').components['mindar-image'].startAR();
          })
          .catch(function(err) {
            alert('Camera blocata: ' + err.message + '\n\nDu-te la Setari browser > Permisiuni site > Camera si permite accesul.');
          });
      }
      document.querySelector('[mindar-image-target]').addEventListener('targetFound', function() {
        var s = document.getElementById('status');
        s.textContent = 'Target detectat!';
        s.style.color = '#00ff88';
      });
      document.querySelector('[mindar-image-target]').addEventListener('targetLost', function() {
        var s = document.getElementById('status');
        s.textContent = 'Cautare target...';
        s.style.color = '#ffff00';
      });
    </script>
  </body>
</html>
