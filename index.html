<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3 - WebAR Image Tracking</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      #ui-overlay {
        position: fixed; top: 16px; left: 50%;
        transform: translateX(-50%); z-index: 999;
        background: rgba(0,0,0,0.55); color: #fff;
        font-family: Arial, sans-serif; font-size: 14px;
        padding: 8px 18px; border-radius: 20px;
        pointer-events: none; text-align: center;
        backdrop-filter: blur(6px);
      }
      #status {
        position: fixed; bottom: 20px; left: 50%;
        transform: translateX(-50%); z-index: 999;
        color: #0f0; font-family: monospace; font-size: 13px;
        background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="ui-overlay">Pointeaza camera spre imaginea TARGET CARD</div>
    <div id="status">Cautare target...</div>

    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiScanning: yes;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">

        <a-box id="main-cube" position="0 0.15 0"
          width="0.3" height="0.3" depth="0.3"
          color="#9B30FF"
          material="metalness: 0.5; roughness: 0.3; emissive: #1a0033"
          animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear"
          animation__bob="property: position; from: 0 0.12 0; to: 0 0.22 0; loop: true; dir: alternate; dur: 1000; easing: easeInOutSine">
        </a-box>

        <a-sphere position="0 0.38 0" radius="0.07" color="#00E676"
          material="metalness: 0.8; roughness: 0.1; emissive: #002200"
          animation__pulse="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; loop: true; dir: alternate; dur: 800; easing: easeInOutSine">
        </a-sphere>

        <a-text value="WebAR - Task 3" align="center" color="#ffffff"
          position="0 -0.35 0.1" rotation="-30 0 0" scale="0.35 0.35 0.35">
        </a-text>

        <a-torus position="0 0.01 0" rotation="90 0 0"
          radius="0.22" radius-tubular="0.015" color="#FF4DAF"
          material="metalness: 0.9; roughness: 0.1"
          animation__spin="property: rotation; from: 90 0 0; to: 90 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <a-light type="point" color="#9B30FF" intensity="1.5" position="0 0.5 0" distance="2"></a-light>
      </a-entity>

      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.6" position="1 2 1"></a-light>
    </a-scene>

    <script>
      var statusEl = document.getElementById('status');
      document.querySelector('[mindar-image-target]').addEventListener('targetFound', function() {
        statusEl.textContent = 'Target detectat!';
        statusEl.style.color = '#0f0';
      });
      document.querySelector('[mindar-image-target]').addEventListener('targetLost', function() {
        statusEl.textContent = 'Cautare target...';
        statusEl.style.color = '#ff0';
      });
    </script>
  </body>
</html>
