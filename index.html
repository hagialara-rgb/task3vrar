<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
      }

      a-scene {
        width: 100%;
        height: 100%;
      }

      #buttons {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        gap: 14px;
      }

      #buttons button {
        padding: 12px 28px;
        border: none;
        border-radius: 50px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
      }

      #btn-color {
        background: #e11d48;
      }

      #btn-anim {
        background: #7c3aed;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; logarithmicDepthBuffer: true"
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      loading-screen="dotsColor: white; backgroundColor: black;"
    >

      <a-assets>
        <a-asset-item id="model1" src="./model.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" near="0.01" far="1000"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model id="model3d" src="#model1" position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-gltf-model>
      </a-entity>

    </a-scene>

    <div id="buttons">
      <button id="btn-color" onclick="schimbaCuloarea()">Schimba Culoarea</button>
      <button id="btn-anim" onclick="toggleAnimatie()">Porneste Animatia</button>
    </div>

    <script>
      var culori = ['#ff0000', '#00aaff', '#00cc44', '#ffaa00', '#cc00ff'];
      var indexCuloare = 0;
      var animatieActiva = false;

      function schimbaCuloarea() {
        var model = document.getElementById('model3d');
        var obj = model.getObject3D('mesh');
        if (!obj) return;
        indexCuloare = (indexCuloare + 1) % culori.length;
        obj.traverse(function(nod) {
          if (nod.isMesh) {
            nod.material.color.set(culori[indexCuloare]);
          }
        });
      }

      function toggleAnimatie() {
        var model = document.getElementById('model3d');
        var btn = document.getElementById('btn-anim');
        if (!animatieActiva) {
          animatieActiva = true;
          model.setAttribute('animation', 'property: rotation; from: 0 0 0; to: 0 360 0; dur: 2000; easing: linear; loop: true');
          btn.textContent = 'Opreste Animatia';
          btn.style.background = '#dc2626';
        } else {
          animatieActiva = false;
          model.removeAttribute('animation');
          model.setAttribute('rotation', '0 0 0');
          btn.textContent = 'Porneste Animatia';
          btn.style.background = '#7c3aed';
        }
      }
    </script>
  </body>
</html>
